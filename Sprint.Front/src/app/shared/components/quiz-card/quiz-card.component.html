<!-- src/app/shared/components/quiz-card/quiz-card.component.html -->
<article
  class="quiz-card"
  [class.quiz-card--disabled]="disabled"
  [class.quiz-card--completed]="status.type === 'completed'"
  [class.quiz-card--in-progress]="status.type === 'in-progress'"
  [class.quiz-card--failed]="status.type === 'failed'"
>
  <div class="quiz-card__header">
    <h3 class="quiz-card__title">{{ title }}</h3>
    <span class="quiz-card__status" *ngIf="status.label">{{ status.label }}</span>
  </div>

  <p class="quiz-card__description" *ngIf="description">{{ description }}</p>

  <div class="quiz-card__meta">
    <div *ngIf="duration" class="quiz-card__meta-item">
      <i class="icon-clock"></i>
      {{ duration }} min
    </div>
    <div *ngIf="totalQuestions" class="quiz-card__meta-item">
      <i class="icon-question"></i>
      {{ totalQuestions }} question<span *ngIf="totalQuestions > 1">s</span>
    </div>
  </div>

  <div *ngIf="progress > 0" class="quiz-card__progress">
    <div class="quiz-card__progress-bar">
      <div class="quiz-card__progress-fill" [style.width.%]="progress"></div>
    </div>
    <small>{{ progress }}% complété</small>
  </div>

  <div *ngIf="score !== null" class="quiz-card__score">
    <strong>{{ score }} / {{ maxScore }}</strong> points
  </div>

  <footer class="quiz-card__footer">
    <ng-content select="[actions]"></ng-content>
  </footer>
</article>
