<!-- src/app/shared/components/search-bar/search-bar.component.html -->
<div class="search-bar">
  <div class="search-bar__container">
    <svg class="search-bar__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="text"
      class="search-bar__input"
      [placeholder]="placeholder"
      [(ngModel)]="searchTerm"
      (input)="onSearch()"
      (keyup.enter)="onSearch()"
    />
  </div>
  <button
    *ngIf="showFilters"
    class="search-bar__filter-btn"
    (click)="onFilterClick()"
    aria-label="Filtres"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
    </svg>
  </button>
</div>
