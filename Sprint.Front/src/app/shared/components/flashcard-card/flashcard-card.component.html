<div
  class="flashcard-card"
  [class.disabled]="disabled"
  role="article"
  [attr.aria-labelledby]="'flashcard-title-' + uniqueId"
>
  <!-- Badges dynamiques (niveau, type) -->
  <div class="flashcard-card__badges" *ngIf="niveauMeta || typeMeta">
    <span
      class="badge"
      [class]="niveauMeta?.class"
      [style.background]="niveauMeta?.color"
      *ngIf="niveauMeta"
      aria-label="Niveau : {{ niveauMeta.label }}"
    >
      <i class="icon {{ niveauMeta.icon }}" aria-hidden="true"></i>
      {{ niveauMeta.label }}
    </span>
    <span
      class="badge"
      [class]="typeMeta?.class"
      [style.background]="typeMeta?.color"
      *ngIf="typeMeta"
      aria-label="Type : {{ typeMeta.label }}"
    >
      <i class="icon {{ typeMeta.icon }}" aria-hidden="true"></i>
      {{ typeMeta.label }}
    </span>
  </div>

  <!-- En-tête avec icône et titre -->
  <div class="flashcard-card__header">
    <div class="flashcard-card__icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 7h16M4 12h16M4 17h10" />
      </svg>
    </div>
    <h3 id="flashcard-title-{{ uniqueId }}" class="flashcard-card__title">{{ title }}</h3>
  </div>

  <!-- Statistiques -->
  <div class="flashcard-card__stats">
    <div class="stat">
      <span class="stat__value">{{ total }}</span>
      <span class="stat__label">Total</span>
    </div>
    <div class="stat">
      <span class="stat__value stat__value--mastered">{{ mastered }}</span>
      <span class="stat__label">Maîtrisées</span>
    </div>
    <div class="stat">
      <span class="stat__value stat__value--in-progress">{{ inProgress }}</span>
      <span class="stat__label">En cours</span>
    </div>
  </div>

  <!-- Barre de progression -->
  <div class="flashcard-card__progress">
    <div class="progress-bar">
      <div class="progress-bar__fill" [style.width.%]="progressPercentage"></div>
    </div>
    <span class="progress-label">{{ progressPercentage }}% maîtrisé</span>
  </div>

  <!-- Statut (Terminé, En cours, Verrouillé) -->
  <div class="flashcard-card__status-badge" [class]="'status--' + status">
    {{ status === 'completed' ? 'Terminé' : status === 'in-progress' ? 'En cours' : 'Verrouillé' }}
  </div>
</div>
